<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18110b"/>
      <stop offset="45%" stop-color="#0e0a08"/>
      <stop offset="100%" stop-color="#050404"/>
    </linearGradient>
    <radialGradient id="goldAudioGlow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#e6b800" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ff7b00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldBar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="60%" stop-color="#ffd000"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="p3Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1080" height="1350" fill="url(#p3Grad)"/>

  <!-- Audio Core Radial Glow -->
  <circle cx="540" cy="580" r="420" fill="url(#goldAudioGlow)"/>

  <!-- Sound Waves Concentric Rings -->
  <g fill="none" stroke="#ffd000" stroke-width="1.5" opacity="0.25">
    <circle cx="540" cy="580" r="140"/>
    <circle cx="540" cy="580" r="220" stroke-dasharray="12 6"/>
    <circle cx="540" cy="580" r="310"/>
    <circle cx="540" cy="580" r="410" stroke-dasharray="6 8"/>
  </g>

  <!-- Big Kinetic Typography in Center -->
  <g font-family="'Syne', -apple-system, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="-1">
    <text x="540" y="460" font-size="108" fill="#201b15" stroke="#483d2e" stroke-width="2">RESONANCE</text>
    <text x="540" y="550" font-size="120" fill="#ffffff" filter="url(#p3Glow)">SFX &amp; TYPE</text>
    <text x="540" y="630" font-size="64" fill="#ffd000" letter-spacing="8">SYNCHRONIZED</text>
  </g>

  <!-- Graphic Equalizer / Spectrum Bars -->
  <g transform="translate(140, 720)">
    <!-- 28 Equalizer frequency bars -->
    <rect x="0" y="100" width="18" height="60" rx="4" fill="url(#goldBar)"/>
    <rect x="28" y="70" width="18" height="90" rx="4" fill="url(#goldBar)"/>
    <rect x="56" y="40" width="18" height="120" rx="4" fill="url(#goldBar)"/>
    <rect x="84" y="20" width="18" height="140" rx="4" fill="url(#goldBar)"/>
    <rect x="112" y="80" width="18" height="80" rx="4" fill="url(#goldBar)"/>
    <rect x="140" y="50" width="18" height="110" rx="4" fill="url(#goldBar)"/>
    <rect x="168" y="10" width="18" height="150" rx="4" fill="url(#goldBar)"/>
    <rect x="196" y="30" width="18" height="130" rx="4" fill="url(#goldBar)"/>
    <rect x="224" y="90" width="18" height="70" rx="4" fill="url(#goldBar)"/>
    <rect x="252" y="60" width="18" height="100" rx="4" fill="url(#goldBar)"/>
    <rect x="280" y="5" width="18" height="155" rx="4" fill="url(#goldBar)"/>
    <rect x="308" y="45" width="18" height="115" rx="4" fill="url(#goldBar)"/>
    <rect x="336" y="15" width="18" height="145" rx="4" fill="url(#goldBar)"/>
    <rect x="364" y="75" width="18" height="85" rx="4" fill="url(#goldBar)"/>
    <rect x="392" y="35" width="18" height="125" rx="4" fill="url(#goldBar)"/>
    <rect x="420" y="0" width="18" height="160" rx="4" fill="url(#goldBar)"/>
    <rect x="448" y="40" width="18" height="120" rx="4" fill="url(#goldBar)"/>
    <rect x="476" y="20" width="18" height="140" rx="4" fill="url(#goldBar)"/>
    <rect x="504" y="65" width="18" height="95" rx="4" fill="url(#goldBar)"/>
    <rect x="532" y="25" width="18" height="135" rx="4" fill="url(#goldBar)"/>
    <rect x="560" y="10" width="18" height="150" rx="4" fill="url(#goldBar)"/>
    <rect x="588" y="50" width="18" height="110" rx="4" fill="url(#goldBar)"/>
    <rect x="616" y="80" width="18" height="80" rx="4" fill="url(#goldBar)"/>
    <rect x="644" y="30" width="18" height="130" rx="4" fill="url(#goldBar)"/>
    <rect x="672" y="15" width="18" height="145" rx="4" fill="url(#goldBar)"/>
    <rect x="700" y="60" width="18" height="100" rx="4" fill="url(#goldBar)"/>
    <rect x="728" y="40" width="18" height="120" rx="4" fill="url(#goldBar)"/>
    <rect x="756" y="90" width="18" height="70" rx="4" fill="url(#goldBar)"/>
    <rect x="784" y="110" width="18" height="50" rx="4" fill="url(#goldBar)"/>
  </g>

  <!-- Viewfinder & Audio Master HUD Info -->
  <g font-family="-apple-system, 'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="22" fill="#e5e5e5" letter-spacing="2">
    <circle cx="160" cy="165" r="8" fill="#ffd000"/>
    <text x="180" y="172" font-weight="700">AUDIO MASTER ●</text>
    <text x="160" y="210" opacity="0.6">SAMPLING: 48kHz / 24-BIT</text>
    <text x="160" y="240" opacity="0.6">LUFS: -14.0 INTEGRATED</text>

    <text x="920" y="172" text-anchor="end" font-weight="700" fill="#ffd000">TC 00:00:32:08</text>
    <text x="920" y="210" text-anchor="end" opacity="0.6">PEAK: -0.1 dB TRUE PEAK</text>
  </g>

  <!-- Typography & Badges Overlay -->
  <g transform="translate(140, 1020)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="380" height="36" rx="6" fill="#221b14" stroke="#423424" stroke-width="1"/>
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffd000" letter-spacing="2">TYPOGRAPHY • SOUND DESIGN • SFX</text>
    
    <!-- Project Title -->
    <text x="0" y="85" font-family="'Syne', -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">TYPOGRAPHY &amp; SOUND DESIGN</text>
    
    <!-- Subtitle / Meta -->
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" fill="#a0a0aa" letter-spacing="0.5">Animated Typography • Precision SFX Sync • Impact Foley</text>
    
    <!-- Instagram Reel indicator -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="220" height="42" rx="21" fill="#ffffff"/>
      <polygon points="26,14 26,28 38,21" fill="#080808"/>
      <text x="48" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#080808" letter-spacing="1.5">WATCH REEL</text>
    </g>
  </g>

  <!-- Scope Letterbox Lines -->
  <rect x="0" y="0" width="1080" height="70" fill="#080808"/>
  <rect x="0" y="1280" width="1080" height="70" fill="#080808"/>
</svg>