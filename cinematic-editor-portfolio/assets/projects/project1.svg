<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150a0a"/>
      <stop offset="40%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#040405"/>
    </linearGradient>
    <!-- Muzzle Flash & Fire Glow -->
    <radialGradient id="fireGlow" cx="65%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#ff7b00" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#ff2a00" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#800000" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sparksGlow" cx="30%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#0044ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silverPlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#a0a0a0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="cinematicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1080" height="1350" fill="url(#p1Grad)"/>

  <!-- Atmospheric Lightings -->
  <circle cx="700" cy="550" r="450" fill="url(#fireGlow)"/>
  <circle cx="320" cy="750" r="400" fill="url(#sparksGlow)"/>

  <!-- Anamorphic Lens Flare Line -->
  <rect x="0" y="540" width="1080" height="4" fill="#00d2ff" opacity="0.65" filter="url(#cinematicGlow)"/>
  <line x1="200" y1="542" x2="880" y2="542" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

  <!-- Gunfire Muzzle Simulation Flare Core -->
  <circle cx="680" cy="542" r="30" fill="#ffffff" filter="url(#cinematicGlow)"/>
  <circle cx="680" cy="542" r="70" fill="#ffaa00" opacity="0.5" filter="url(#cinematicGlow)"/>

  <!-- Compositing Grid / VFX Wireframe Elements -->
  <g opacity="0.25" stroke="#ffffff" stroke-width="1">
    <line x1="120" y1="120" x2="960" y2="120"/>
    <line x1="120" y1="1230" x2="960" y2="1230"/>
    <line x1="120" y1="120" x2="120" y2="1230"/>
    <line x1="960" y1="120" x2="960" y2="1230"/>
    <!-- Center Guide Cross -->
    <line x1="540" y1="640" x2="540" y2="710"/>
    <line x1="505" y1="675" x2="575" y2="675"/>
  </g>

  <!-- AI Generated Crowd Silhouette Compositing Layer -->
  <g opacity="0.45" fill="#0c0c12">
    <!-- Silhouettes of crowd in background -->
    <path d="M100,1100 Q150,920 200,910 Q250,910 280,1100 Z"/>
    <path d="M240,1130 Q290,950 330,940 Q380,940 410,1130 Z"/>
    <path d="M370,1120 Q420,900 470,890 Q520,890 550,1120 Z"/>
    <path d="M520,1140 Q570,960 620,950 Q670,950 710,1140 Z"/>
    <path d="M680,1110 Q730,910 780,900 Q830,900 870,1110 Z"/>
    <path d="M830,1130 Q880,930 930,920 Q980,920 1020,1130 Z"/>
  </g>

  <!-- Foreground Protagonist Silhouette -->
  <g fill="#020204">
    <path d="M380,1350 C380,1050 420,950 490,900 C470,860 480,780 540,780 C600,780 610,860 590,900 C660,950 700,1050 700,1350 Z"/>
  </g>

  <!-- VFX Particle Sparks -->
  <g fill="#ffc83b">
    <circle cx="620" cy="480" r="3"/>
    <circle cx="650" cy="430" r="2"/>
    <circle cx="720" cy="490" r="4"/>
    <circle cx="750" cy="440" r="2.5"/>
    <circle cx="790" cy="520" r="3.5"/>
    <circle cx="830" cy="470" r="2"/>
    <circle cx="580" cy="520" r="3"/>
    <circle cx="530" cy="460" r="2"/>
    <circle cx="710" cy="380" r="2.5"/>
  </g>

  <!-- Cinematic Viewfinder HUD Overlays -->
  <g font-family="-apple-system, 'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="22" fill="#e5e5e5" letter-spacing="2">
    <!-- Camera Status -->
    <circle cx="160" cy="165" r="8" fill="#ff3b30"/>
    <text x="180" y="172" font-weight="700">REC ●</text>
    <text x="160" y="210" opacity="0.6">4K RAW / 23.976 FPS</text>
    <text x="160" y="240" opacity="0.6">SHUTTER: 1/48 / ISO 800</text>
    
    <!-- Timecode -->
    <text x="920" y="172" text-anchor="end" font-weight="700" fill="#00d2ff">TC 00:01:24:18</text>
    <text x="920" y="210" text-anchor="end" opacity="0.6">LUT: CINE_ACTION_GOLD</text>
  </g>

  <!-- Typography & Badges Overlay -->
  <g transform="translate(140, 1020)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="380" height="36" rx="6" fill="#1b1c24" stroke="#333745" stroke-width="1"/>
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#00d2ff" letter-spacing="2">VFX • AI GENERATION • EDITING</text>
    
    <!-- Project Title -->
    <text x="0" y="85" font-family="'Syne', -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">CINEMATIC ACTION FILM</text>
    
    <!-- Subtitle / Meta -->
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" fill="#a0a0aa" letter-spacing="0.5">Gunfire Simulation • AI Crowd Synthesis • Audio Processing</text>
    
    <!-- Instagram Reel indicator -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="220" height="42" rx="21" fill="url(#silverPlate)"/>
      <polygon points="26,14 26,28 38,21" fill="#080808"/>
      <text x="48" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#080808" letter-spacing="1.5">WATCH REEL</text>
    </g>
  </g>

  <!-- Scope Letterbox Lines -->
  <rect x="0" y="0" width="1080" height="70" fill="#080808"/>
  <rect x="0" y="1280" width="1080" height="70" fill="#080808"/>
</svg>