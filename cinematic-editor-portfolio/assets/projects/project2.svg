<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1218"/>
      <stop offset="45%" stop-color="#07090f"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <!-- Motion Slice Gradient -->
    <linearGradient id="sliceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7b2cbf" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="portalGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#7b2cbf" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="p2Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1080" height="1350" fill="url(#p2Grad)"/>

  <!-- Portal Center Glow -->
  <circle cx="540" cy="560" r="420" fill="url(#portalGlow)"/>

  <!-- Dynamic Diagonal Speed Ramp Cut Lines -->
  <polygon points="120,200 960,380 960,620 120,440" fill="url(#sliceGrad)" opacity="0.4"/>
  <polygon points="120,500 960,680 960,920 120,740" fill="url(#sliceGrad)" opacity="0.25"/>

  <!-- Dynamic Whip Transition Curved Beziers -->
  <path d="M100,680 C350,300 730,850 980,450" fill="none" stroke="#00f5d4" stroke-width="4" filter="url(#p2Glow)"/>
  <path d="M100,720 C350,340 730,890 980,490" fill="none" stroke="#ff007f" stroke-width="3" opacity="0.75" filter="url(#p2Glow)"/>

  <!-- Kinetic Motion Frames / Match Cuts Overlay -->
  <g opacity="0.35" stroke="#ffffff" stroke-width="1.5">
    <!-- Frame 1 -->
    <rect x="240" y="320" width="280" height="420" rx="12" fill="none" stroke-dasharray="10 5"/>
    <!-- Frame 2 Offset (Match Cut) -->
    <rect x="560" y="380" width="280" height="420" rx="12" fill="none"/>
    <!-- Connection Vectors -->
    <line x1="520" y1="530" x2="560" y2="530" stroke="#00f5d4" stroke-width="3"/>
  </g>

  <!-- Viewfinder & Speed Ramp HUD Info -->
  <g font-family="-apple-system, 'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="22" fill="#e5e5e5" letter-spacing="2">
    <circle cx="160" cy="165" r="8" fill="#00f5d4"/>
    <text x="180" y="172" font-weight="700">VELOCITY MATCH ●</text>
    <text x="160" y="210" opacity="0.6">RAMP: 300% ➔ 100% ➔ 450%</text>
    <text x="160" y="240" opacity="0.6">MOTION BLUR: 180° SHUTTER</text>

    <text x="920" y="172" text-anchor="end" font-weight="700" fill="#00f5d4">TC 00:00:45:12</text>
    <text x="920" y="210" text-anchor="end" opacity="0.6">FPS: 60.000 ULTRA SMOOTH</text>
  </g>

  <!-- Dynamic Caption Graphic Emulation -->
  <g transform="translate(360, 680)">
    <rect x="0" y="0" width="360" height="54" rx="8" fill="#0c0d14" stroke="#00f5d4" stroke-width="2"/>
    <text x="180" y="35" font-family="'Syne', -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">SEAMLESS FLOW</text>
  </g>

  <!-- Typography & Badges Overlay -->
  <g transform="translate(140, 1020)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="380" height="36" rx="6" fill="#151b24" stroke="#253547" stroke-width="1"/>
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#00f5d4" letter-spacing="2">REELS • TRANSITIONS • CAPTIONS</text>
    
    <!-- Project Title -->
    <text x="0" y="85" font-family="'Syne', -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">SEAMLESS TRANSITIONS</text>
    
    <!-- Subtitle / Meta -->
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" fill="#a0a0aa" letter-spacing="0.5">Visual Continuity • Engaging Pacing • Precision Captions</text>
    
    <!-- Instagram Reel indicator -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="220" height="42" rx="21" fill="#ffffff"/>
      <polygon points="26,14 26,28 38,21" fill="#080808"/>
      <text x="48" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#080808" letter-spacing="1.5">WATCH REEL</text>
    </g>
  </g>

  <!-- Scope Letterbox Lines -->
  <rect x="0" y="0" width="1080" height="70" fill="#080808"/>
  <rect x="0" y="1280" width="1080" height="70" fill="#080808"/>
</svg>