<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <defs>
    <linearGradient id="hfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a20"/>
      <stop offset="100%" stop-color="#06080a"/>
    </linearGradient>
    <linearGradient id="hfGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa820a"/>
    </linearGradient>
    <filter id="hfGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#d4af37" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="76" height="76" rx="16" fill="url(#hfBg)" stroke="#2d3748" stroke-width="2"/>
  <g transform="translate(40, 40)" filter="url(#hfGlow)">
    <!-- Higgsfield Quantum Vector Field & Anamorphic Ring -->
    <ellipse cx="0" cy="0" rx="22" ry="9" fill="none" stroke="url(#hfGold)" stroke-width="2" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="22" ry="9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6 4" transform="rotate(30)"/>
    <circle cx="0" cy="0" r="5" fill="url(#hfGold)"/>
  </g>
</svg>