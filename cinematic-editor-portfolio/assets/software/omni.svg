<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <defs>
    <linearGradient id="omniBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="omniCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00bbf9"/>
    </linearGradient>
    <filter id="omniGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="76" height="76" rx="16" fill="url(#omniBg)" stroke="#162942" stroke-width="2"/>
  <g transform="translate(40, 40)" filter="url(#omniGlow)">
    <!-- Omni AI concentric neural aperture -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="url(#omniCyan)" stroke-width="2.5" stroke-dasharray="14 6"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 4"/>
    <circle cx="0" cy="0" r="6" fill="url(#omniCyan)"/>
    <line x1="-26" y1="0" x2="-20" y2="0" stroke="url(#omniCyan)" stroke-width="2"/>
    <line x1="20" y1="0" x2="26" y2="0" stroke="url(#omniCyan)" stroke-width="2"/>
    <line x1="0" y1="-26" x2="0" y2="-20" stroke="url(#omniCyan)" stroke-width="2"/>
    <line x1="0" y1="20" x2="0" y2="26" stroke="url(#omniCyan)" stroke-width="2"/>
  </g>
</svg>